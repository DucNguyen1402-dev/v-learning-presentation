<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V-Learning Presentation</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/slides.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <main class="presentation" data-presentation></main>
    <nav class="presentation-controls" aria-label="Điều hướng thuyết trình">
      <button type="button" data-action="previous" aria-label="Trang trước">
        ←
      </button>
      <span data-slide-count>1 / 1</span>
      <button type="button" data-action="next" aria-label="Trang tiếp theo">
        →
      </button>
    </nav>
    <script src="js/presentation.js"></script>
    <script src="js/navigation.js"></script>
  </body>
</html>
