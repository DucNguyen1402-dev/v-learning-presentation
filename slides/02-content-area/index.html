<section
  class="slide agenda-section"
  data-slide
  aria-label="Nội dung trình bày"
>
  <!-- Trang trí họa tiết chấm tròn góc trên bên phải -->
  <div class="dots-decoration"></div>

  <!-- Tiêu đề chính -->
  <div class="agenda-header">
    <div class="accent-line"></div>
    <h2 class="title">Nội dung trình bày</h2>
  </div>

  <!-- Danh sách 2 thẻ nội dung -->
  <div class="cards-grid" data-reveal-list>
    <!-- Thẻ 01 -->
    <div class="agenda-card">
      <div class="card-skeleton" aria-hidden="true">
        <span class="skeleton-icon"></span>
        <span class="skeleton-line skeleton-line--title"></span>
      </div>
      <div class="card-content">
        <div class="card-header">
          <div class="icon-box">01</div>
        </div>
        <h3 class="card-title">Tổng quan sản phẩm</h3>
        <ul class="card-list">
          <li>Sản phẩm & Chức năng chính</li>
          <li>User flow & Giao diện</li>
          <li>Admin side & Quản trị</li>
        </ul>
      </div>
    </div>

    <!-- Thẻ 02 -->
    <div class="agenda-card">
      <div class="card-skeleton" aria-hidden="true">
        <span class="skeleton-icon"></span>
        <span class="skeleton-line skeleton-line--title"></span>
      </div>
      <div class="card-content">
        <div class="card-header">
          <div class="icon-box">02</div>
        </div>
        <h3 class="card-title">Kiến trúc & công nghệ</h3>
        <ul class="card-list">
          <li>Công nghệ nền tảng</li>
          <li>Kiến trúc Frontend</li>
        </ul>
      </div>
    </div>

    <!-- Thẻ 03 -->
    <div class="agenda-card">
      <div class="card-skeleton" aria-hidden="true">
        <span class="skeleton-icon"></span>
        <span class="skeleton-line skeleton-line--title"></span>
      </div>
      <div class="card-content">
        <div class="card-header">
          <div class="icon-box">03</div>
        </div>
        <h3 class="card-title">Demo trải nghiệm người dùng</h3>
        <ul class="card-list">
          <li>User flow & Giao diện</li>
          <li>Admin side & Quản trị</li>
        </ul>
      </div>
    </div>
  </div>
</section>
