<section

  <!-- Danh sách 2 thẻ nội dung -->
  <div class="cards-grid">

    <div class="agenda-card">
      <div class="card-header">
        <div class="icon-box">01</div>
      </div>

      <div class="card-divider"></div>

        <li>User flow & Giao diện</li>
        <li>Admin side & Quản trị</li>
      </ul>

    <!-- Thẻ 02 -->
    <div class="agenda-card">
      <div class="card-header">
        <div class="icon-box">02</div>
      </div>
      <h3 class="card-title">Kiến trúc & công nghệ</h3>
      <div class="card-divider"></div>
      <ul class="card-list">
        <li>Công nghệ nền tảng</li>
        <li>Kiến trúc Frontend</li>
      </ul>
    </div>

    <!-- Thẻ 03 -->
    <div class="agenda-card">
      <div class="card-header">
        <div class="icon-box">03</div>
      </div>
      <h3 class="card-title">Demo trải nghiệm</h3>
      <div class="card-divider"></div>
      <ul class="card-list">
        <li>User flow & Giao diện</li>
        <li>Admin side & Quản trị</li>
      </ul>
    </div>

</section>
