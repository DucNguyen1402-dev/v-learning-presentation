<section class="slide flowchart-section" data-slide aria-label="User flow">
  <div class="demo-window">
    <header class="demo-header">
      <div>
        <span class="demo-kicker">01/USER FLOW</span>
        <h1>User flow</h1>
        <p>Khám phá, đăng ký và bắt đầu học trên V-learning.</p>
      </div>
    </header>

    <div class="flow-container">
      <div
        class="flow-card user-flow-card is-active"
        aria-labelledby="user-flow-title"
      >
        <div class="flow-node">
          <span class="node-box">Đăng nhập / đăng ký</span>
        </div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">
          <span class="node-box">Trang chủ</span>
        </div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">
          <span class="node-box">Danh sách khóa học</span>
        </div>
        <div class="flow-arrow split-arrow">↙ &nbsp;&nbsp;&nbsp;&nbsp; ↘</div>
        <div class="flow-row">
          <div class="flow-node">
            <span class="node-box">Tìm kiếm</span>
            <div class="flow-arrow">↘</div>
          </div>
          <div class="flow-node">
            <span class="node-box">Lọc</span>
            <div class="flow-arrow">↙</div>
          </div>
        </div>

        <div class="flow-node">
          <span class="node-box">Chi tiết khóa học</span>
        </div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">
          <span class="node-box">Đăng ký khóa học</span>
        </div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">
          <span class="node-box">Khóa học của tôi</span>
        </div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">
          <span class="node-box">Chi tiết học phần</span>
        </div>
        <div class="flow-arrow split-arrow">↙ &nbsp;&nbsp;&nbsp;&nbsp; ↘</div>
        <div class="flow-row">
          <div class="flow-node">
            <span class="node-box accent-box"
              >Bắt đầu học<small>sắp triển khai</small></span
            >
          </div>
          <div class="flow-node">
            <span class="node-box warning-box">Hủy khóa học</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
