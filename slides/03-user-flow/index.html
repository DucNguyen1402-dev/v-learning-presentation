<section
  class="slide user-flow-slide"
  data-slide
  aria-label="User flow và giao diện học viên"
>
  <header class="user-flow-header">
    <span class="user-flow-badge">USER FLOW</span>
    <h1>User Flow và Giao diện Học viên</h1>
  </header>

  <div class="user-flow-layout">
    <aside class="flow-steps" aria-label="Các bước trong user flow">
      <div class="flow-steps-heading">
        <span class="flow-steps-label">Hành trình</span>
        <span class="flow-steps-count">07 bước</span>
      </div>

      <ol>
        <li><span>01</span><strong>Đăng nhập</strong></li>
        <li><span>02</span><strong>Trang chủ</strong></li>
        <li><span>03</span><strong>Danh sách khóa học</strong></li>
        <li><span>04</span><strong>Xem chi tiết</strong></li>
        <li><span>05</span><strong>Đăng ký khóa học</strong></li>
        <li><span>06</span><strong>Danh sách Khóa học cá nhân</strong></li>
        <li><span>08</span><strong>Chi tiết khóa học cá nhân</strong></li>
        <li><span>07</span><strong>Bắt đầu học [UI Demo]</strong></li>
      </ol>
    </aside>

    <section class="flow-gallery" aria-label="Ảnh giao diện học viên">
      <div class="flow-gallery-toolbar">
        <span>Giao diện thực tế</span>
        <div class="flow-gallery-controls">
          <button
            type="button"
            data-flow-scroll="left"
            aria-label="Cuộn sang trái"
          >
            ←
          </button>
          <button
            type="button"
            data-flow-scroll="right"
            aria-label="Cuộn sang phải"
          >
            →
          </button>
        </div>
      </div>

      <div class="flow-viewport" data-flow-viewport tabindex="0">
        <div class="flow-track">
          <figure class="flow-screen flow-screen-wide">
            <img
              src="slides/03-user-flow/screenshots/course-list.png"
              alt="Màn hình danh sách khóa học"
              draggable="false"
            />
            <figcaption><span>01</span> Khám phá khóa học</figcaption>
          </figure>
          <figure class="flow-screen flow-screen-wide">
            <img
              src="slides/03-user-flow/screenshots/course-detail.png"
              alt="Màn hình chi tiết khóa học"
              draggable="false"
            />
            <figcaption><span>02</span> Xem chi tiết và đăng ký</figcaption>
          </figure>
          <figure class="flow-screen flow-screen-compact">
            <img
              src="slides/03-user-flow/screenshots/personal-courses.png"
              alt="Màn hình danh sách khóa học cá nhân"
              draggable="false"
            />
            <figcaption><span>03</span> Quản lý khóa học cá nhân</figcaption>
          </figure>
          <figure class="flow-screen flow-screen-wide">
            <img
              src="slides/03-user-flow/screenshots/personal-course-detail.png"
              alt="Màn hình chi tiết khóa học cá nhân"
              draggable="false"
            />
            <figcaption><span>04</span> Bắt đầu học</figcaption>
          </figure>
        </div>
      </div>

      <div class="flow-gallery-progress" aria-hidden="true">
        <span data-flow-progress></span>
      </div>
    </section>
  </div>
</section>
