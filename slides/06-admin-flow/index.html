<section
  class="slide user-flow-slide"
  data-slide
  aria-label="Admin Side và giao diện quản trị viên"
>
  <header class="user-flow-header">
    <h1>Admin Side và Giao diện Quản trị viên</h1>
  </header>

  <div class="user-flow-layout">
    <aside class="flow-steps" aria-label="Các bước trong admin flow">
      <div class="flow-steps-heading">
        <span class="flow-steps-label">Chức năng quản trị</span>
        <span class="flow-steps-count">02 nhóm</span>
      </div>

      <ol>
        <li><span>01</span><strong>Quản lý khóa học</strong></li>
        <li><span>02</span><strong>Quản lý người dùng</strong></li>
      </ol>
    </aside>

    <section class="flow-gallery" aria-label="Ảnh giao diện quản trị viên">
      <div class="flow-viewport" data-flow-viewport tabindex="0">
        <div class="flow-track" data-flow-track>
          <figure
            class="flow-screen flow-screen-wide is-active"
            data-flow-slide
          >
            <img
              src="slides/06-admin-flow/screenshots/course-management.png"
              alt="Màn hình quản lý khóa học"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/06-admin-flow/screenshots/user-management.png"
              alt="Màn hình quản lý người dùng"
              draggable="false"
            />
          </figure>
        </div>
      </div>

      <div class="flow-gallery-progress" aria-hidden="true">
        <span data-flow-progress></span>
      </div>
    </section>
  </div>
</section>
