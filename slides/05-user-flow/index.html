<section
  class="slide user-flow-slide"
  data-slide
  aria-label="User flow và giao diện học viên"
>
  <header class="user-flow-header">
    <h1>User Flow và Giao diện Học viên</h1>
  </header>

  <div class="user-flow-layout">
    <aside class="flow-steps" aria-label="Các bước trong user flow">
      <div class="flow-steps-heading">
        <span class="flow-steps-label">Flow</span>
        <span class="flow-steps-count">08 bước</span>
      </div>

      <ol>
        <li><span>01</span><strong>Đăng nhập</strong></li>
        <li><span>02</span><strong>Trang chủ</strong></li>
        <li><span>03</span><strong>Danh sách khóa học</strong></li>
        <li><span>04</span><strong>Xem chi tiết</strong></li>
        <li><span>05</span><strong>Đăng ký khóa học</strong></li>
        <li><span>06</span><strong>Danh sách khóa học cá nhân</strong></li>
        <li><span>07</span><strong>Chi tiết khóa học cá nhân</strong></li>
        <li><span>08</span><strong>Bắt đầu học [Chưa triển khai]</strong></li>
      </ol>
    </aside>

    <section class="flow-gallery" aria-label="Ảnh giao diện học viên">
      <div class="flow-viewport" data-flow-viewport tabindex="0">
        <div class="flow-track" data-flow-track>
          <figure
            class="flow-screen flow-screen-wide is-active"
            data-flow-slide
          >
            <img
              src="slides/05-user-flow/screenshots/login.png"
              alt="Màn hình đăng nhập"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/05-user-flow/screenshots/home.png"
              alt="Màn hình trang chủ"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/05-user-flow/screenshots/course-list.png"
              alt="Màn hình danh sách khóa học"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/05-user-flow/screenshots/course-detail.png"
              alt="Màn hình chi tiết khóa học"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/05-user-flow/screenshots/course-detail-payment.png"
              alt="Màn hình đăng ký khóa học"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/05-user-flow/screenshots/personal-course-list.png"
              alt="Màn hình danh sách khóa học cá nhân"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/05-user-flow/screenshots/personal-course-detail.png"
              alt="Màn hình chi tiết khóa học cá nhân"
              draggable="false"
            />
          </figure>
          <figure class="flow-screen flow-screen-wide" data-flow-slide>
            <img
              src="slides/05-user-flow/screenshots/studying.png"
              alt="Màn hình bắt đầu học"
              draggable="false"
            />
          </figure>
        </div>
      </div>

      <div class="flow-gallery-progress" aria-hidden="true">
        <span data-flow-progress></span>
      </div>
    </section>
  </div>
</section>
